name: CI/CD Pipeline (Testing Only)

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to DockerHub (Testing)
        run: |
          echo "Logging in to DockerHub..."
          docker login -u alavalapatikishroe -p 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

      - name: Build and Push Docker Image
        run: |
          docker build -t alavalapatikishore/employee-login-app:latest .
          docker push alavalapatikishore/employee-login-app:latest

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig (Testing)
        run: |
          echo "Writing kubeconfig..."
          cat <<EOF > kubeconfig.yaml
apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://192.168.216.128:6443
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: kubernetes-admin
  name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
kind: Config
preferences: {}
users:
- name: kubernetes-admin
  user:
    client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
    client-key-data: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0t...
EOF
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/employee-login-deployment.yaml
          kubectl apply -f k8s/employee-login-service.yaml
          kubectl rollout status deployment/employee-login
