name: Docker Static Website CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t saikishorea/employee-login-app:${{ github.sha }} .
          docker tag saikishorea/employee-login-app:${{ github.sha }} saikishorea/employee-login-app:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker images
        run: |
          docker push saikishorea/employee-login-app:${{ github.sha }}
          docker push saikishorea/employee-login-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/employee-login-app \
            employee-login-app=saikishorea/employee-login-app:${{ github.sha }}
          kubectl rollout status deployment/employee-login-app
