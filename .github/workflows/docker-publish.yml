name: Test Docker Secrets
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Docker Login
        run: |
          if [[ -n "${{ secrets.DOCKER_USERNAME }}" && -n "${{ secrets.DOCKER_TOKEN }}" ]]; then
            echo "✅ Both Docker secrets are set"
            echo "Username: ${{ secrets.DOCKER_USERNAME }}"
            echo "Token starts with: ${DOCKER_TOKEN:0:8}..."
          else
            echo "❌ Missing Docker secrets"
          fi
