apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-login-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: employee-login.local   # change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: employee-login-service
            port:
              number: 80
